<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stake</title>
<style>
:root{--bg:#07110d;--panel:#0d1b15;--panel2:#12251c;--line:#20372b;--text:#f3f7f4;--muted:#8fa197;--green:#00e701;--red:#ed1746;--gold:#f2c94c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#17382a 0,#07110d 48%);color:var(--text);font-family:Inter,Arial,sans-serif;min-height:100vh}
header{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#08130fdd;backdrop-filter:blur(10px);position:sticky;top:0;z-index:5}
.logo{font-size:25px;font-weight:900;letter-spacing:-1px}.logo span{color:var(--green)}
.balance{background:#12251c;border:1px solid #294334;border-radius:10px;padding:10px 16px;font-weight:800}.balance small{color:var(--muted);font-weight:600;margin-right:7px}
nav{display:flex;gap:8px;padding:18px 28px 0;max-width:1100px;margin:auto}nav button{background:transparent;border:0;color:var(--muted);padding:12px 18px;border-radius:8px;font-weight:800;cursor:pointer}nav button.active{background:#163024;color:white}
main{max-width:1100px;margin:20px auto;padding:0 28px}.page{display:none}.page.active{display:block}
.card{background:linear-gradient(145deg,#102018,#0b1712);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 15px 45px #0005}
.game{display:grid;grid-template-columns:300px 1fr;gap:18px}.controls label{display:block;color:var(--muted);font-size:12px;font-weight:800;margin:14px 0 7px}.input{width:100%;padding:13px;background:#07100c;border:1px solid #294334;border-radius:8px;color:#fff;font-size:15px;outline:none}.row{display:flex;gap:8px}.row .input{flex:1}
button.primary{width:100%;border:0;border-radius:8px;background:var(--green);color:#041006;padding:14px;font-weight:900;font-size:15px;cursor:pointer;margin-top:18px}button.primary:hover{filter:brightness(.9)}button.secondary{background:#172c22;color:#fff;border:1px solid #294334;border-radius:8px;padding:10px 12px;font-weight:800;cursor:pointer}
.roulette-area{min-height:430px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.wheel{width:310px;height:310px;border-radius:50%;border:12px solid #1e3028;box-shadow:0 0 0 3px #0a120e,0 20px 60px #0009;position:relative;transition:transform 4s cubic-bezier(.12,.72,.12,1);background:conic-gradient(#bd102d 0deg 30deg,#111 30deg 60deg,#bd102d 60deg 90deg,#111 90deg 120deg,#bd102d 120deg 150deg,#111 150deg 180deg,#bd102d 180deg 210deg,#111 210deg 240deg,#bd102d 240deg 270deg,#111 270deg 300deg,#bd102d 300deg 330deg,#111 330deg 360deg)}
.wheel:after{content:"";position:absolute;inset:22%;border-radius:50%;background:#0c1812;border:5px solid #30493b;box-shadow:inset 0 0 25px #000}.pointer{width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:30px solid var(--gold);position:absolute;top:0;z-index:2;filter:drop-shadow(0 3px 3px #000)}
.result{font-size:24px;font-weight:900;margin-top:22px}.red{color:#ff3157}.black{color:#fff}.green{color:var(--green)}
.mines-layout{max-width:650px;margin:auto}.mine-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:20px}.tile{aspect-ratio:1;background:#193126;border:1px solid #2d4c3d;border-radius:9px;cursor:pointer;font-size:25px;font-weight:900;color:white;display:flex;align-items:center;justify-content:center;transition:.15s}.tile:hover{transform:translateY(-2px);background:#214033}.tile.safe{background:#0e4728;border-color:#1ca952}.tile.bomb{background:#5b1222;border-color:#ed1746}.stats{text-align:center;color:var(--muted);font-size:13px;margin-top:12px}.notice{color:#7f9188;font-size:12px;text-align:center;margin-top:18px}
@media(max-width:760px){header{padding:0 16px}.game{grid-template-columns:1fr}main{padding:0 14px}nav{padding-left:14px;padding-right:14px}.wheel{width:260px;height:260px}}
</style>
</head>
<body>
<header>
  <div class="logo">ST<span>A</span>KE</div>
  <div class="balance"><small>Balance</small><span id="balance">$10,000.00</span></div>
</header>

<nav>
  <button class="active" onclick="showPage('roulette',this)">Roulette</button>
  <button onclick="showPage('mines',this)">Mines</button>
</nav>

<main>
<section id="roulette" class="page active">
  <div class="game">
    <div class="card controls">
      <h2 style="margin:0">Roulette</h2>
      <label>Bet</label>
      <div class="row"><input id="rBet" class="input" type="number" value="100" min="1"><button class="secondary" onclick="setBet('rBet',100)">100</button></div>
      <label>Choose</label>
      <select id="rPick" class="input">
        <option value="red">Red — x2</option><option value="black">Black — x2</option><option value="green">Green — x14</option>
      </select>
      <button class="primary" onclick="spin()">SPIN</button>
      <div class="notice">Simulation only — virtual credits</div>
    </div>
    <div class="card roulette-area">
      <div class="pointer"></div>
      <div id="wheel" class="wheel"></div>
      <div id="rResult" class="result">Place your bet</div>
    </div>
  </div>
</section>

<section id="mines" class="page">
  <div class="card mines-layout">
    <h2 style="margin:0;text-align:center">Mines</h2>
    <div class="controls" style="max-width:300px;margin:auto">
      <label>Bet</label><input id="mBet" class="input" type="number" value="100" min="1">
      <label>Mines</label><select id="mineCount" class="input"><option>3</option><option>5</option><option>10</option><option>15</option></select>
      <button id="startBtn" class="primary" onclick="startMines()">START</button>
    </div>
    <div id="mineGrid" class="mine-grid"></div>
    <div id="mStats" class="stats">Start a game to begin.</div>
    <div style="display:flex;justify-content:center;margin-top:14px"><button id="cashBtn" class="secondary" style="display:none" onclick="cashout()">CASH OUT</button></div>
    <div class="notice">Simulation only — no real money</div>
  </div>
</section>
</main>

<script>
let balance=10000, spinning=false, mines=[], mineActive=false, mineBet=0, multiplier=1, revealed=0;
const $=id=>document.getElementById(id);
function money(n){return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function update(){ $('balance').textContent=money(balance) }
function setBet(id,n){$(id).value=n}
function showPage(id,btn){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}

function spin(){
 if(spinning)return;
 let bet=Number($('rBet').value), pick=$('rPick').value;
 if(!bet||bet<=0||bet>balance){alert('Bet invalide.');return}
 balance-=bet;update();spinning=true;
 let wheel=$('wheel'); let extra=1440+Math.floor(Math.random()*1440); wheel.style.transform=`rotate(${extra}deg)`;
 setTimeout(()=>{
   let roll=Math.floor(Math.random()*37), color=roll===0?'green':(roll%2?'red':'black');
   let win=color===pick, mult=pick==='green'?14:2;
   if(win){let payout=bet*mult;balance+=payout;$('rResult').innerHTML=`<span class="${color}">WON — ${roll}</span> <small style="color:#8fa197">+${money(payout-bet)}</small>`}
   else $('rResult').innerHTML=`<span class="${color}">LOST — ${roll}</span>`;
   update();spinning=false;
 },4000)
}

function startMines(){
 if(mineActive)return;
 mineBet=Number($('mBet').value); let count=Number($('mineCount').value);
 if(!mineBet||mineBet<=0||mineBet>balance){alert('Bet invalide.');return}
 balance-=mineBet;update();mineActive=true;multiplier=1;revealed=0;
 mines=[];while(mines.length<count){let n=Math.floor(Math.random()*25);if(!mines.includes(n))mines.push(n)}
 let grid=$('mineGrid');grid.innerHTML='';
 for(let i=0;i<25;i++){let b=document.createElement('button');b.className='tile';b.textContent='';b.onclick=()=>revealMine(i,b);grid.appendChild(b)}
 $('mStats').textContent='Multiplier : x1.00 — Find the safe tiles.';
 $('cashBtn').style.display='inline-block';$('startBtn').textContent='IN PROGRESS'
}
function revealMine(i,b){
 if(!mineActive||b.classList.contains('safe')||b.classList.contains('bomb'))return;
 if(mines.includes(i)){b.classList.add('bomb');b.textContent='💣';mineActive=false;document.querySelectorAll('.tile').forEach((x,j)=>{if(mines.includes(j)){x.classList.add('bomb');x.textContent='💣'}});$('mStats').textContent='BOOM — Bet perdue.';$('cashBtn').style.display='none';$('startBtn').textContent='START';return}
 b.classList.add('safe');b.textContent='◆';revealed++;
 multiplier=1+(revealed*.18);
 $('mStats').textContent=`Multiplier : x${multiplier.toFixed(2)} — Potential win ${money(mineBet*multiplier)}`;
}
function cashout(){
 if(!mineActive)return;
 let payout=mineBet*multiplier;balance+=payout;update();mineActive=false;
 $('mStats').textContent=`CASH OUT — ${money(payout)} credited.`;
 $('cashBtn').style.display='none';$('startBtn').textContent='START';
}
update();
</script>
</body>
</html>
